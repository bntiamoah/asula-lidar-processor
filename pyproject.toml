[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "asula-lidar-processor"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.15,<2",
    "boto3>=1.38,<2",
    "fastapi>=0.115,<1",
    "laspy[lazrs]>=2.6,<3",
    "numpy>=2.2,<3",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.10,<3",
    "pyproj>=3.7,<4",
    "sqlalchemy>=2,<3",
    "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["pointcloud*"]

[tool.ruff]
target-version = "py313"
line-length = 100
